name: rebuild registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild registry.json
        run: python _tools/build_registry.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain registry.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add registry.json
            git commit -m "chore: rebuild registry.json"
            git push
          else
            echo "registry.json unchanged"
          fi
